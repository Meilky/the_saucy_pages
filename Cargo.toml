[package]
name = "the_saucy_pages"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenv = "0.15.0"
iced = { version = "0.14.0", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "uuid", "derive", "migrate"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.1", features = ["v7", "serde"] }
